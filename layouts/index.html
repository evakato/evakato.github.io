{{ define "main" }}
<h1>{{ .Site.Title }}</h1>
{{ with .Params.location }}
<p class="location-pin">{{ . }}</p>
{{ end }}
<article>
  {{ with resources.Get "images/pfp2026_cropped2.jpeg" }} {{ $img := .Resize
  "1000x 92" }}
  <img
    class="portrait"
    src="{{ $img.RelPermalink }}"
    width="{{ $img.Width }}"
    height="{{ $img.Height }}"
    alt="Portrait"
  />
  {{ end }} {{ .Content }}
</article>
{{ end }}
